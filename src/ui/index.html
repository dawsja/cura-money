<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/logo.ico" />
    <link rel="icon" type="image/png" sizes="any" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Cura Money</title>
    <!--
      Apply the user's theme class before React mounts so the first paint
      matches the saved preference. Without this, the page briefly renders
      in the default (light) theme and "flashes" when dark mode is enabled.
      The key `cura.theme` and the values `light` / `dark` are the contract
      with src/ui/src/lib/theme.ts — keep them in sync.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('cura.theme');
          var theme =
            stored ||
            (window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (_) {
          /* localStorage blocked (private mode, etc.) — fall back to light. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
